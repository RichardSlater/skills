name: Fuzzing

on:
  schedule:
    # Run weekly on Monday at 00:00 UTC (same schedule as Scorecard)
    - cron: "0 0 * * 1"
  pull_request:
    paths:
      - "fuzzing/**"
      - ".github/workflows/fuzzing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ClusterFuzzLite:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        sanitizer:
          - address
    steps:
      - name: Build fuzzers (${{ matrix.sanitizer }})
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@1791529b93a039c918b36130a26d1b8033f2e0fa # v1
        with:
          sanitizer: ${{ matrix.sanitizer }}
          language: python

      - name: Run fuzzers (${{ matrix.sanitizer }})
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@1791529b93a039c918b36130a26d1b8033f2e0fa # v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          fuzz_seconds: 300
          mode: "batch"
          sanitizer: ${{ matrix.sanitizer }}
