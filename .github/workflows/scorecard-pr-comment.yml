name: Scorecard pull request summary

on:
  workflow_run:
    workflows: [Scorecard pull request analysis]
    types: [completed]

permissions: {}

jobs:
  comment:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download Scorecard report
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          github-token: ${{ github.token }}
          name: scorecard-pr-json
          path: ${{ runner.temp }}/scorecard
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Render sanitized summary
        env:
          REPORT: ${{ runner.temp }}/scorecard/results.json
        run: |
          python - <<'PY'
          import json
          import os
          import re

          report = json.load(open(os.environ["REPORT"], encoding="utf-8"))

          def format_score(value):
              try:
                  score = float(value)
              except (TypeError, ValueError):
                  return "N/A"
              return f"{score:.1f}/10" if 0 <= score <= 10 else "N/A"

          checks = []
          for check in report.get("checks", []):
              name = re.sub(r"[^A-Za-z0-9 ._-]", "?", str(check.get("name", "unknown")))
              checks.append((name, format_score(check.get("score"))))

          lines = [
              "<!-- scorecard-pr-summary -->",
              "## OpenSSF Scorecard summary",
              "",
              f"**Overall score:** {format_score(report.get('score'))}",
              "",
          ]
          if checks:
              lines.extend([
                  "| Check | Score |",
                  "| --- | ---: |",
              ])
              lines.extend(f"| {name} | {score} |" for name, score in sorted(checks))
          else:
              lines.append("Scorecard returned no check breakdown.")
          with open("comment.json", "w", encoding="utf-8") as handle:
              json.dump({"body": "\n".join(lines)}, handle)
          PY

      - name: Create or update pull request comment
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          marker='<!-- scorecard-pr-summary -->'
          comment_id="$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$comment_id" --input comment.json >/dev/null
          else
            gh api --method POST "repos/$GH_REPO/issues/$PR_NUMBER/comments" --input comment.json >/dev/null
          fi
