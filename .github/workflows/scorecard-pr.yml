name: Scorecard pull request analysis

on: pull_request

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis (pull request)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.json
          results_format: json
          publish_results: false

      - name: Render Scorecard summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import re

          report = json.load(open("results.json", encoding="utf-8"))

          def format_score(value):
              try:
                  score = float(value)
              except (TypeError, ValueError):
                  return "N/A"
              return f"{score:.1f}/10" if 0 <= score <= 10 else "N/A"

          checks = []
          for check in report.get("checks", []):
              name = re.sub(r"[^A-Za-z0-9 ._-]", "?", str(check.get("name", "unknown")))
              checks.append((name, format_score(check.get("score"))))

          print("## OpenSSF Scorecard")
          print()
          print(f"**Overall score:** {format_score(report.get('score'))}")
          print()
          if checks:
              print("| Check | Score |")
              print("| --- | ---: |")
              for name, score in sorted(checks):
                  print(f"| {name} | {score} |")
          else:
              print("Scorecard returned no check breakdown.")
          PY

      - name: Upload Scorecard report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-pr-json
          path: results.json
          if-no-files-found: error
          retention-days: 1
