name: Scorecard pull request analysis

on: pull_request

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis (pull request)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Render Scorecard summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import re

          report = json.load(open("results.sarif", encoding="utf-8"))
          checks = {}
          for run in report.get("runs", []):
              for result in run.get("results", []):
                  name = re.sub(r"[^A-Za-z0-9_.-]", "?", str(result.get("ruleId", "unknown")))
                  message = str(result.get("message", {}).get("text", ""))
                  match = re.search(r"\bscore is ([0-9]+(?:\.[0-9]+)?)\b", message, re.IGNORECASE)
                  checks[name] = f"{float(match.group(1)):.1f}/10" if match else "n/a"
          print("## OpenSSF Scorecard")
          print()
          if checks:
              print("| Reported check | Score |")
              print("| --- | ---: |")
              for name, score in sorted(checks.items()):
                  print(f"| {name} | {score} |")
          else:
              print("Scorecard reported no failing checks for this pull request.")
          PY

      - name: Upload Scorecard report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-pr-sarif
          path: results.sarif
          if-no-files-found: error
          retention-days: 1
