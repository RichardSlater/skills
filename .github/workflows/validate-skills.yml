name: Validate Skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/validate.txt

      - name: Run pre-commit quality checks
        run: |
          python -m pip install pre-commit
          pre-commit run --show-diff-on-failure --color=always --all-files

      - name: Validate SKILL.md files
        run: |
          find skills -name SKILL.md -print0 | while IFS= read -r -d '' skill; do
            npx --yes skills-ref@0.1.5 validate "$(dirname "$skill")"
          done

      - name: Check skills are discoverable
        run: npx --yes skills@1.5.12 add . --list -y

      - name: Validate Python scripts compile
        run: |
          find skills -type d -name scripts -print0 | while IFS= read -r -d '' dir; do
            python -m compileall -q "$dir"
          done

      - name: Lint Python
        uses: astral-sh/ruff-action@57714a7c8a2e59f32539362ba31877a1957dded1 # v3.5.1
        with:
          version: "0.12.0"
          args: check
          src: skills

      - name: Run unit tests
        run: python -m unittest discover -s skills/github-supply-chain-hardening-remediation/tests -v

      - name: Install OpenSSF Best Practices test dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r tests/requirements-openssf-best-practices.txt

      - name: Test OpenSSF Best Practices skill with coverage
        run: |
          python -m coverage run --rcfile=tests/.coveragerc -m unittest discover -s tests/openssf_best_practices -v
          python -m coverage report --rcfile=tests/.coveragerc

      - name: Verify GitHub Actions are covered by Dependabot
        run: |
          grep -q "package-ecosystem: github-actions" .github/dependabot.yml
