name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing protected v{major}.{minor}.{patch} tag to release
        required: true
        type: string
      pre_release:
        description: Publish as v{major}.{minor}.{patch}-beta0
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      archive: ${{ steps.package.outputs.archive }}
      pre_release: ${{ steps.verify.outputs.pre_release }}
      tag: ${{ steps.verify.outputs.tag }}
      tag_sha: ${{ steps.verify.outputs.tag_sha }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag
        id: verify
        env:
          PRE_RELEASE: ${{ inputs.pre_release }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use v{major}.{minor}.{patch}." >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_sha="$(git rev-parse "$TAG^{commit}")"
          git merge-base --is-ancestor "$tag_sha" origin/main
          semver="${TAG#v}"
          if [[ "$PRE_RELEASE" == "true" ]]; then
            semver="${semver}-beta0"
          fi
          echo "pre_release=$PRE_RELEASE" >> "$GITHUB_OUTPUT"
          echo "tag=v$semver" >> "$GITHUB_OUTPUT"
          echo "tag_sha=$tag_sha" >> "$GITHUB_OUTPUT"
          echo "semver=$semver" >> "$GITHUB_OUTPUT"

      - name: Package skills
        id: package
        env:
          SEMVER: ${{ steps.verify.outputs.semver }}
        run: |
          archive="skills-${SEMVER}.zip"
          files=(skills README.md LICENSE CONTRIBUTING.md SECURITY.md SUPPORT.md)
          for optional_file in GOVERNANCE.md ROADMAP.md; do
            if [[ -f "$optional_file" ]]; then
              files+=("$optional_file")
            fi
          done
          zip -r "$archive" "${files[@]}"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-archive
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: package
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download release archive
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-archive
          path: ${{ runner.temp }}/release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ runner.temp }}/release/${{ needs.package.outputs.archive }}
          PRE_RELEASE: ${{ needs.package.outputs.pre_release }}
          TAG: ${{ needs.package.outputs.tag }}
          TAG_SHA: ${{ needs.package.outputs.tag_sha }}
        run: |
          test -f "$ARCHIVE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace its assets." >&2
            exit 1
          fi
          release_args=("$TAG" "$ARCHIVE" --target "$TAG_SHA" --title "$TAG" --generate-notes)
          if [[ "$PRE_RELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"
