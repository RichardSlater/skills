name: Publish release

on:
  push:
    branches: [main]

# One run observes and mutates release state at a time. Runs must never cancel
# each other because every release is bound to its triggering commit.
concurrency:
  group: automated-release-main
  cancel-in-progress: false

permissions: {}

jobs:
  plan-package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: write
      id-token: write
    outputs:
      archive: ${{ steps.package.outputs.archive }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
      release_required: ${{ steps.plan.outputs.release_required }}
      semver: ${{ steps.plan.outputs.semver }}
      sha: ${{ steps.plan.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Checkout triggering commit with complete history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: 6.3.x

      - name: Calculate version
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0

      - name: Validate plan and release signal
        id: plan
        env:
          GITVERSION_SEMVER: ${{ steps.gitversion.outputs.MajorMinorPatch }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          semver="$GITVERSION_SEMVER"
          if [[ ! "$semver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "GitVersion returned an invalid stable SemVer: $semver" >&2
            exit 1
          fi
          tag="v$semver"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          previous_tag="$(git tag --merged "$SHA" --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)"
          range="$SHA"
          if [[ -n "$previous_tag" ]]; then range="$previous_tag..$SHA"; fi
          messages="$(git log --format=%B "$range")"
          release_required=false
          if grep -Eq '^[a-z][a-z0-9-]*(\([^)[:cntrl:]]+\))?!: .+$|^BREAKING CHANGE: .+$|^feat(\([^)[:cntrl:]]+\))?: .+$|^fix(\([^)[:cntrl:]]+\))?: .+$' <<<"$messages"; then
            release_required=true
          fi
          printf 'semver=%s\ntag=%s\nprevious_tag=%s\nrelease_required=%s\nsha=%s\n' \
            "$semver" "$tag" "$previous_tag" "$release_required" "$SHA" >> "$GITHUB_OUTPUT"

      - name: Package skills
        if: steps.plan.outputs.release_required == 'true'
        id: package
        env:
          SEMVER: ${{ steps.plan.outputs.semver }}
        run: |
          set -euo pipefail
          archive="skills-${SEMVER}.zip"
          files=(skills README.md LICENSE CONTRIBUTING.md SECURITY.md SUPPORT.md)
          for optional_file in GOVERNANCE.md ROADMAP.md; do
            [[ -f "$optional_file" ]] && files+=("$optional_file")
          done
          zip -r "$archive" "${files[@]}"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Attest release archive
        if: steps.plan.outputs.release_required == 'true'
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3.0.0
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Upload release archive
        if: steps.plan.outputs.release_required == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-archive-${{ github.run_id }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 1

      - name: Report no-release decision
        if: steps.plan.outputs.release_required != 'true'
        run: echo "No Conventional Commit release signal exists in the unreleased range."

  publish:
    needs: plan-package
    if: needs.plan-package.outputs.release_required == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download prepared archive
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-archive-${{ github.run_id }}
          path: ${{ runner.temp }}/release

      - name: Mint publishing app token
        id: release-app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.1.4
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout planned commit for tag signing
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.plan-package.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
          token: ${{ steps.release-app-token.outputs.token }}

      - name: Sign and publish immutable release
        env:
          ARCHIVE: ${{ runner.temp }}/release/${{ needs.plan-package.outputs.archive }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          RELEASE_GPG_KEY_ID: ${{ vars.RELEASE_GPG_KEY_ID }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          PREVIOUS_TAG: ${{ needs.plan-package.outputs.previous_tag }}
          SEMVER: ${{ needs.plan-package.outputs.semver }}
          SHA: ${{ needs.plan-package.outputs.sha }}
          TAG: ${{ needs.plan-package.outputs.tag }}
        run: |
          set -euo pipefail
          test -f "$ARCHIVE"
          [[ "$SEMVER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          export GNUPGHOME="$RUNNER_TEMP/release-gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg_fingerprint="$(gpg --batch --with-colons --list-secret-keys "$RELEASE_GPG_KEY_ID" | awk -F: '$1 == "fpr" { print $10; exit }')"
          [[ "$gpg_fingerprint" =~ ^[A-F0-9]{40}$ ]]
          checksum="${ARCHIVE}.sha256"
          sha256sum "$ARCHIVE" > "$checksum"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$RELEASE_GPG_PASSPHRASE" \
            --local-user "$gpg_fingerprint" --armor --detach-sign --output "${ARCHIVE}.asc" "$ARCHIVE"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$RELEASE_GPG_PASSPHRASE" \
            --local-user "$gpg_fingerprint" --armor --detach-sign --output "${checksum}.asc" "$checksum"
          [[ "$TAG" == "v$SEMVER" ]]
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          # This API check does not require checkout or execution of repository code.
          status="$(gh api "repos/$GH_REPO/compare/$SHA...main" --jq .status)"
          if [[ "$status" != "ahead" && "$status" != "identical" ]]; then
            echo "Planned SHA is no longer reachable from main." >&2
            exit 1
          fi
          tag_exists=false
          release_exists=false
          tag_sha=""
          if tag_ref="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" 2>/dev/null)"; then
            tag_exists=true
            object_type="$(jq -r '.object.type' <<<"$tag_ref")"
            object_sha="$(jq -r '.object.sha' <<<"$tag_ref")"
            if [[ "$object_type" == "tag" ]]; then
              tag_sha="$(gh api "repos/$GH_REPO/git/tags/$object_sha" --jq .object.sha)"
            else
              tag_sha="$object_sha"
            fi
            if [[ "$tag_sha" != "$SHA" ]]; then
              echo "Existing $TAG points to another commit; refusing to move it." >&2
              exit 1
            fi
          fi
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then release_exists=true; fi
          if [[ "$release_exists" == true && "$tag_exists" == false ]]; then
            echo "A release exists without its expected immutable tag; refusing to continue." >&2
            exit 1
          fi
          if [[ "$tag_exists" == false ]]; then
            git config user.name "Skills Release"
            git config user.email "git@scetrov.live"
            git tag -s -u "$gpg_fingerprint" -m "Release $TAG" "$TAG" "$SHA"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
            git push origin "refs/tags/$TAG"
          else
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          fi
          verification="$(git verify-tag --raw "$TAG" 2>&1)"
          grep -F "VALIDSIG $gpg_fingerprint" <<< "$verification"
          if [[ "$release_exists" == true ]]; then
            echo "Release $TAG is already complete; assets will not be replaced."
            exit 0
          fi
          args=("$TAG" "$ARCHIVE" "$checksum" "${ARCHIVE}.asc" "${checksum}.asc" --repo "$GH_REPO" --title "$TAG" --target "$SHA" --generate-notes)
          [[ -n "$PREVIOUS_TAG" ]] && args+=(--notes-start-tag "$PREVIOUS_TAG")
          gh release create "${args[@]}"
