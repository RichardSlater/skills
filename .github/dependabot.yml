version: 2
updates:
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 10
    groups:
      low-risk:
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 5
    commit-message:
      prefix: chore
      include: scope
    reviewers:
      - RichardSlater

  - package-ecosystem: pip
    directory: /skills/github-supply-chain-hardening-analysis
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 10
    groups:
      low-risk:
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 5
    commit-message:
      prefix: chore
      include: scope
    reviewers:
      - RichardSlater

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 10
    groups:
      low-risk:
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 5
    commit-message:
      prefix: chore
      include: scope
    reviewers:
      - RichardSlater
