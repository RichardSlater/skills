default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      # Ruff skips EXE001 on WSL; check Git's executable bits on every platform.
      - id: check-shebang-scripts-are-executable
        files: ^skills/.*\.py$
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: '\.md$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: [--fix]
        files: ^skills/

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.50.0
    hooks:
      - id: markdownlint
        # OpenSpec-generated specs use a fixed template layout (WHEN/THEN
        # scenario lists that are intentionally not surrounded by blank lines).
        # Linting them produces noise without value, so exclude the whole tree.
        exclude: ^openspec/
